name: Portal validation
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.13.0'
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run test:directus-date
      - run: node --test scripts/smoke-route.test.mjs
      - name: Sync published Directus articles
        env:
          DIRECTUS_CONTENTS_ENABLED: ${{ vars.DIRECTUS_CONTENTS_ENABLED }}
          DIRECTUS_PUBLIC_READ: ${{ vars.DIRECTUS_PUBLIC_READ || 'true' }}
          DIRECTUS_API_URL: ${{ secrets.DIRECTUS_API_URL }}
          DIRECTUS_READ_TOKEN: ${{ secrets.DIRECTUS_READ_TOKEN }}
          DIRECTUS_ARTICLES_COLLECTION: ${{ vars.DIRECTUS_ARTICLES_COLLECTION || 'fieldnotes' }}
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
        run: |
          if [ "$DIRECTUS_CONTENTS_ENABLED" = "true" ]; then
            if [ -z "$DIRECTUS_API_URL" ] || { [ "$DIRECTUS_PUBLIC_READ" != "true" ] && [ -z "$DIRECTUS_READ_TOKEN" ]; }; then
              echo "Directus is enabled but the API URL or required read credentials are missing." >&2
              exit 1
            fi
            npm run cms:sync
          else
            echo "Directus publishing is disabled; repository content will be used."
          fi
      - run: npx playwright install --with-deps chromium
      - run: npm run test:content
      - run: npm run test:a11y
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: accessibility-${{ github.sha }}
          path: .codex/accessibility-results/
          retention-days: 14
      - run: npm run build
        env:
          PUBLIC_MOTION_MODE: ${{ vars.PUBLIC_MOTION_MODE || 'subtle' }}
          ITSDEV_CONTENT_SOURCE: ${{ vars.DIRECTUS_CONTENTS_ENABLED == 'true' && 'directus' || '' }}
          DIRECTUS_API_URL: ${{ secrets.DIRECTUS_API_URL }}
          DIRECTUS_READ_TOKEN: ${{ secrets.DIRECTUS_READ_TOKEN }}
          ADSENSE_ENABLED: ${{ vars.ADSENSE_ENABLED }}
          ADSENSE_ACCOUNT_READY: ${{ vars.ADSENSE_ACCOUNT_READY }}
          ADSENSE_CONSENT_READY: ${{ vars.ADSENSE_CONSENT_READY }}
          ADSENSE_ADS_TXT_READY: ${{ vars.ADSENSE_ADS_TXT_READY }}
          ADSENSE_PERFORMANCE_READY: ${{ vars.ADSENSE_PERFORMANCE_READY }}
      - run: npm run verify
      - run: npm run test:e2e
      - run: npm run deploy:check
      - name: Deploy production Worker
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          DIRECTUS_CONTENTS_ENABLED: ${{ vars.DIRECTUS_CONTENTS_ENABLED }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npm run deploy
      - name: Smoke-test published article
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: npm run smoke:production
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: portal-${{ github.sha }}
          path: dist/
