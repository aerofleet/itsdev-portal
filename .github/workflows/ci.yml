name: Portal validation
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.13.0'
          cache: npm
      - run: npm ci
      - run: npm run check
      - name: Sync published Directus articles
        env:
          DIRECTUS_CONTENTS_ENABLED: ${{ vars.DIRECTUS_CONTENTS_ENABLED }}
          DIRECTUS_API_URL: ${{ secrets.DIRECTUS_API_URL }}
          DIRECTUS_READ_TOKEN: ${{ secrets.DIRECTUS_READ_TOKEN }}
          DIRECTUS_ARTICLES_COLLECTION: ${{ vars.DIRECTUS_ARTICLES_COLLECTION || 'fieldnotes' }}
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
        run: |
          if [ "$DIRECTUS_CONTENTS_ENABLED" = "true" ]; then
            if [ -z "$DIRECTUS_API_URL" ] || [ -z "$DIRECTUS_READ_TOKEN" ]; then
              echo "Directus is enabled but API credentials are missing." >&2
              exit 1
            fi
            npm run cms:sync
          else
            echo "Directus publishing is disabled; repository content will be used."
          fi
      - run: npx playwright install --with-deps chromium
      - run: npm run test:content
      - run: npm run test:a11y
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: accessibility-${{ github.sha }}
          path: .codex/accessibility-results/
          retention-days: 14
      - run: npm run build
        env:
          ITSDEV_CONTENT_SOURCE: ${{ vars.DIRECTUS_CONTENTS_ENABLED == 'true' && 'directus' || '' }}
          DIRECTUS_API_URL: ${{ secrets.DIRECTUS_API_URL }}
          DIRECTUS_READ_TOKEN: ${{ secrets.DIRECTUS_READ_TOKEN }}
      - run: npm run verify
      - run: npm run test:e2e
      - run: npm run deploy:check
      - uses: actions/upload-artifact@v4
        with:
          name: portal-${{ github.sha }}
          path: dist/
